<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素地牢 · 官方源码网页版</title>
<style>:root{color-scheme:dark;font:14px system-ui,"Microsoft YaHei",sans-serif;background:#10140f;color:#dae3cb}*{box-sizing:border-box}body{margin:0}header{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #35402d;flex-wrap:wrap}strong{color:#c4d99a}button,a{font:inherit;color:#d6e5bd;background:#273321;border:1px solid #46573a;border-radius:5px;padding:5px 10px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#3b4d30}.meta{color:#9da990;font-size:12px}#message{display:none;margin:10px 14px;padding:12px;background:#433a20;color:#f8e3a8;border-radius:5px}iframe{display:block;width:100%;height:calc(100dvh - 90px);border:0;background:#000}footer{font-size:11px;color:#8c9880;padding:7px 14px}footer a{padding:0;border:0;background:none}input{display:none}</style></head><body>
<style>html,body{width:100%;height:100%;overflow:hidden;background:#000}header,footer{display:none}iframe{width:100%;height:100dvh}#message{position:fixed;top:0;left:0;right:0;z-index:10}.management{overflow:auto}.management body{overflow:auto}.management header{display:flex}.management footer{display:block}.management iframe{height:calc(100dvh - 90px)}.management #message{position:static}</style>
<header><strong>像素地牢</strong><span id="version" class="meta">读取版本…</span><button id="export">导出存档</button><button id="import">导入存档</button><button id="restore">升级前备份</button><button id="recover">替换前备份</button><a href="source.zip">源码</a></header>
<div id="message" role="status"></div><iframe id="game" title="破碎的像素地牢网页版" allow="autoplay; fullscreen"></iframe>
<footer>非官方网页移植 · 以官方开源稳定版为基线 · 一个当前存档，保存在此浏览器。原作 <a href="https://shatteredpixel.com/shatteredpd/">Evan Debenham</a> / Watabou · <a href="LICENSE.txt">GPL</a></footer><input type="file" id="file" accept="application/json,.json">
<style>dialog{max-width:min(430px,90vw);padding:24px;background:#20261c;color:#e4e9dc;border:2px solid #697857;border-radius:8px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 12px;font-size:21px}dialog p{line-height:1.7}dialog .choices{display:flex;gap:10px;flex-wrap:wrap}dialog button{padding:10px 14px}dialog button:disabled{opacity:.4;cursor:default}#death-error{color:#f5c787}</style>
<dialog id="death"><h2>本次冒险已结束</h2><p id="death-description"></p><p>存档已保留。选择结束本局后，才会清除本局进度。</p><p id="death-error" role="status"></p><div class="choices"><button id="retry-floor">从本层开头重试</button><button id="death-export">导出存档</button><button id="end-run">结束本局</button></div></dialog>
<script type="module">
import {createStore,importLegacy,acquireWriter,CURRENT_KEY,UPGRADE_KEY,RECOVERY_KEY} from './store.mjs';
const management=new URLSearchParams(location.search).get('manage')==='1';
document.documentElement.classList.toggle('management',management);
const frame=document.querySelector('#game'),message=document.querySelector('#message');
const show=text=>{message.textContent=text;message.style.display='block';};
let store,lease,version;
const death=document.querySelector('#death'),deathError=document.querySelector('#death-error');
death.addEventListener('cancel',event=>event.preventDefault());
function showDeath(){
  document.querySelector('#retry-floor').disabled=!store?.canRetry;
  document.querySelector('#death-description').textContent=store?.canRetry?'可以回到第 '+store.checkpointDepth+' 层进入时的状态，恢复当时的生命、位置、背包和地图。':'当前没有可用的本层检查点，可以先导出存档保留进度。';
  if(!death.open)death.showModal();
}
window.portalShowDeath=showDeath;
window.portalSaveWarning=text=>{deathError.textContent=text;if(!death.open)show(text);};
document.querySelector('#retry-floor').onclick=()=>{try{store.retryFloor();location.reload();}catch(error){deathError.textContent=error.message;}};
document.querySelector('#end-run').onclick=()=>{try{store.endRun();location.reload();}catch(error){deathError.textContent=error.message;}};
document.querySelector('#death-export').onclick=()=>document.querySelector('#export').click();
function download(value,name){const url=URL.createObjectURL(new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.querySelector('#export').onclick=()=>{let warning;try{frame.contentWindow?.portalSaveNow?.();store?.flush();}catch(error){warning=error.message;}try{download(store?store.export():localStorage.getItem(CURRENT_KEY)||'{}','pixel-dungeon-save.json');if(warning)show('本地保存失败，已导出内存中的进度：'+warning);}catch(error){show(error.message);}};
document.querySelector('#import').onclick=()=>document.querySelector('#file').click();
document.querySelector('#file').onchange=async event=>{
  try{const file=event.target.files[0];if(!file)return;if(file.size>8*1024*1024)throw new Error('备份文件过大。');
    const imported=await importLegacy(JSON.parse(await file.text()));
    if(!store||!lease?.renew())throw new Error('当前页面不能写入存档，请关闭其他页面后重载。');
    if(!confirm('导入后将替换当前进度。原进度会保留为恢复备份，是否继续？'))return;
    store.install(imported);location.reload();
  }catch(error){show(error.message);}finally{event.target.value='';}
};
function restoreBackup(key){
  try{const raw=localStorage.getItem(key);if(!raw)throw new Error('尚无此类备份。');const backup=JSON.parse(raw);
    if(!version||backup.engine.code>version.code)throw new Error('备份也来自更高版本，请先使用对应的游戏版本。');
    if(!confirm('恢复升级前的进度？当前进度会另行保留。'))return;
    if(!lease?.renew())throw new Error('另一个页面正在使用存档，请先关闭它。');
    if(store)store.install(backup);
    else{const old=localStorage.getItem(CURRENT_KEY);if(old)localStorage.setItem('portal-pd.recovery.v1',old);localStorage.setItem(CURRENT_KEY,raw);}
    location.reload();
  }catch(error){show(error.message);}
}
document.querySelector('#restore').onclick=()=>restoreBackup(UPGRADE_KEY);
document.querySelector('#recover').onclick=()=>restoreBackup(RECOVERY_KEY);
try{
  const response=await fetch('./play/version.json');if(!response.ok)throw new Error('版本信息加载失败。');version=await response.json();
  document.querySelector('#version').textContent=version.version+' · 官方源码移植';
  const owner=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);lease=acquireWriter(localStorage,owner);
  if(!lease.acquired)throw new Error('另一个页面正在使用这个存档，请先关闭它，再刷新此页。');
  setInterval(()=>{if(!lease.renew()){frame.remove();show('本页已停止写入存档。请重新打开游戏，读取最新进度。');}},2500);
  store=createStore(localStorage,version);
  store.setWriteGuard(lease.renew);window.portalStore=store;
  if(management&&store.migrationPending)show('发现旧版进度：请进入并继续游戏。验证可读取后才会保存升级结果，旧档会保留为恢复备份。');
  if(store.dead)showDeath();else frame.src='./play/';
  window.addEventListener('pagehide',()=>{try{frame.contentWindow?.portalSaveNow?.();store.flush();}catch{}lease.release();});
  window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='game-error')show('游戏运行错误：'+event.data.message+'。可先导出存档保留进度。');});
}catch(error){show(error.message);}
</script></body></html>
